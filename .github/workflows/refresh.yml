name: Refresh JOE listings

# 11:00 UTC is 07:00 in New York while daylight saving is in effect, and 06:00 once
# EST starts on 2 Nov 2026. If the hour matters, change this to "0 12 * * *" then.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}

# Needed to commit the rebuilt page back to the repository.
permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the page
        working-directory: pipeline
        run: |
          set -euo pipefail

          # Yesterday's snapshot carries each listing's first_seen date and the posting
          # date parsed from JOE. Without it every listing looks new and the Posted
          # column empties out.
          if [ -f ../state/joe_snapshot.json ]; then
            cp ../state/joe_snapshot.json prior_snapshot.json
          else
            echo "No prior snapshot — treating this as the first run."
          fi

          sh fetch.sh
          python3 posted.py      # exits non-zero if it cannot date 95% of listings
          python3 score.py
          python3 classify.py

      # A board that cannot be read contributes nothing and the rest of the feed still
      # publishes. ejm_parse.py writes no file unless the whole parse succeeded, so a
      # failure here means merge.py builds from JOE alone and the page says EJM is missing.
      - name: EconJobMarket
        id: ejm
        working-directory: pipeline
        continue-on-error: true
        run: |
          set -euo pipefail
          sh ejm_fetch.sh
          python3 ejm_parse.py

      - name: Merge, diff and render
        working-directory: pipeline
        run: |
          set -euo pipefail
          python3 merge.py
          python3 digest.py     # what changed since the last run -> digest.json
          python3 dash2.py

      # Checked per board, not on the total. A board that contributes nothing is an
      # expected, survivable failure — the page says so and the rest still publishes.
      # A board that comes back with two thirds of yesterday's listings is a broken
      # parse wearing the costume of news, and must not be committed.
      - name: Refuse to publish a collapsed feed
        working-directory: pipeline
        run: |
          python3 - <<'PY'
          import json, os, sys, collections
          def src_of(jid, v):
              return v.get('src') or (jid.split(':', 1)[0] if ':' in jid else 'joe')
          new = json.load(open('joe_snapshot.json'))['listings']
          counts = collections.Counter(src_of(k, v) for k, v in new.items())
          if os.path.exists('prior_snapshot.json'):
              prior = json.load(open('prior_snapshot.json'))
              prior = prior.get('listings', prior)
              was = collections.Counter(src_of(k, v) for k, v in prior.items())
              for src, before in sorted(was.items()):
                  now = counts.get(src, 0)
                  if before > 20 and now == 0:
                      print(f"NOTE: {src} contributed nothing — publishing without it.")
                  elif before > 20 and now < 0.8 * before:
                      sys.exit(f"FATAL: {src} returned {now} listings today vs {before} "
                               "yesterday. That is a broken parse, not news — "
                               "publishing nothing.")
          print(f"{len(new)} listings {dict(counts)}")
          PY

      - name: Move the results into place
        run: |
          set -euo pipefail
          mkdir -p state
          cp pipeline/site/index.html index.html
          cp pipeline/joe_snapshot.json state/joe_snapshot.json
          cp pipeline/digest.json state/digest.json

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html state/joe_snapshot.json state/digest.json
          if git diff --quiet --cached; then
            echo "Nothing changed today — no commit."
          else
            git commit -m "Refresh listings $(date -u +%Y-%m-%d)"
            git push
          fi
